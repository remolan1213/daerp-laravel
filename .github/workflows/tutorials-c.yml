name: Tutorials - C
on:
  workflow_dispatch:
  push:
    paths:
      - 'tutorials/projects/c/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential
          for d in tutorials/projects/c/*; do
            if [ -d "$d" ]; then
              echo "Testing $d"
              cd "$d"
              make
              if [ -d tests ]; then
                make -C tests
              fi
              cd -
            fi
          done
